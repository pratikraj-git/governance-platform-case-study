<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    Brand mark: three stacked horizontal lines (full, ¾, ½) 
    the same architectural glyph used in SiteShell's BrandMark component.
    Renders cleanly at 16px, 32px, and 64px.
  -->
  <rect x="4" y="9"  width="24" height="2" rx="1" fill="#0E0F0E"/>
  <rect x="4" y="15" width="18" height="2" rx="1" fill="#0E0F0E"/>
  <rect x="4" y="21" width="12" height="2" rx="1" fill="#0E0F0E"/>
</svg>
